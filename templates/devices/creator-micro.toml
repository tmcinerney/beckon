# Beckon v1 fragment proposal - NOT loaded by the current binary.
# Copy into ~/.config/beckon/conf.d/ to enable, delete to disable.
#
# A device owns its own channel declarations. Six channels below is a layout
# choice, not a limit: add more channels to bind every physical key.
#
# Channels do NOT carry slot ids. Layers declare which bindings they show.

kind = "device"
id = "creator-micro"

[transport]
input = "creator-micro-oai-hid"   # v.oai.hid press/release notifications
display = "creator-micro-usb"     # v.oai.rgbcfg + v.oai.thstatus

# An output channel is any addressable target.
[[display.channel]]
id = "key-1"
address = { ag = 6 }

[[display.channel]]
id = "key-2"
address = { ag = 7 }

[[display.channel]]
id = "key-3"
address = { ag = 8 }

[[display.channel]]
id = "key-4"
address = { ag = 9 }

[[display.channel]]
id = "key-5"
address = { ag = 10 }

[[display.channel]]
id = "key-6"
address = { ag = 11 }

# AG06-AG11 deliberately avoids ChatGPT/Codex slots 0-5, which are
# layer-agnostic and would otherwise blank our overrides.
[[display.channel]]
id = "ring"
address = { zone = "ambient" }

[[display.channel]]
id = "underlay"
address = { zone = "keys" }

[display.presentation]
# Colours and motion live in settings.toml (app-owned, mutable). These are
# fallback values only when the corresponding setting is absent.
ring_color = "#FF4975"
ring_motion = "breathe"
base_color = "#B366FF"

# A layer is a source filter over the ONE global binding ledger. On the Rex
# layer every key is a Rex binding; on the Herdr layer every key is a Herdr
# binding. Same physical channels, different subset. Validation rejects a
# projection that selects a slot whose binding source does not match.
[layers.rex]
source = "rex"
channels = ["key-1", "key-2", "key-3", "key-4", "key-5", "key-6"]

# [layers.herdr]
# source = "herdr"
# channels = ["key-1", "key-2", "key-3", "key-4", "key-5", "key-6"]
# Requires the Herdr layer's top six keys to be changed from KC_NONE to AG
# keycodes first. See docs/v1-design.md.

# No projection is declared for the ChatGPT layer. That layer is a competing
# HID host owning AG00-AG05 and must be left alone.

# A physical AG key press resolves to the slot currently projected on that
# channel for the active layer (tracked via device.status.layer_index).
[[input.binding]]
key = "AG06"
channel = "key-1"

[[input.binding]]
key = "AG07"
channel = "key-2"

[[input.binding]]
key = "AG08"
channel = "key-3"

[[input.binding]]
key = "AG09"
channel = "key-4"

[[input.binding]]
key = "AG10"
channel = "key-5"

[[input.binding]]
key = "AG11"
channel = "key-6"
