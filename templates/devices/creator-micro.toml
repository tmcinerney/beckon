# Beckon v1 fragment proposal - NOT loaded by the current binary.
# Copy into ~/.config/beckon/conf.d/ to enable, delete to disable.
#
# Physical OAI addresses are DERIVED from the device keymap (/fs/keymap.json),
# not declared here. This file declares semantics only. See docs/v1-design.md.

kind = "device"
id = "creator-micro"

[transport]
input = "creator-micro-oai-hid"   # v.oai.hid press/release
display = "creator-micro-usb"     # v.oai.rgbcfg + v.oai.thstatus
address_source = "device"         # or "declared" for devices with no readable keymap

# Stable control ids. The adapter maps (layer, control) -> transport address
# by reading layout.keymap, layout.encoders, layout.joystick.sectors and the
# ambient/keys lighting zones. Positions are row-major over the [2,4,4,3]
# matrix, but the OAI id for each is layer-specific and never hardcoded here.
# Roles are declared per control, not derived from AG/ACT keycodes. They may
# be overridden per layer. `bindable` says what kind of binding may attach.
[[controls]]
id = "key-1"
kind = "key"
role = "agent"
bindable = ["agent"]
position = 0

[[controls]]
id = "key-2"
kind = "key"
role = "agent"
bindable = ["agent"]
position = 1

[[controls]]
id = "key-3"
kind = "key"
role = "agent"
bindable = ["agent"]
position = 2

[[controls]]
id = "key-4"
kind = "key"
role = "agent"
bindable = ["agent"]
position = 3

[[controls]]
id = "key-5"
kind = "key"
role = "agent"
bindable = ["agent"]
position = 4

[[controls]]
id = "key-6"
kind = "key"
role = "agent"
bindable = ["agent"]
position = 5

# A layer may declare more, fewer, or different controls. These are examples;
# unlisted controls are simply unassigned.
# [[controls]]
# id = "dial"
# kind = "dial"          # ids 13-14, input only, never lights
# [[controls]]
# id = "joystick"
# kind = "joystick"      # ids 15-18 + v.oai.rad, input only, never lights
[[controls]]
id = "ring"
kind = "display"
role = "display"
bindable = []
zone = "ambient"

[[controls]]
id = "underlay"
kind = "display"
role = "display"
bindable = []
zone = "keys"

[display.presentation]
# Colours and motion live in settings.toml (app-owned, mutable).
ring_color = "#FF4975"
ring_motion = "breathe"
base_color = "#B366FF"

# Each layer is a sparse projection over the ONE global binding ledger.
# `source` filters which bindings may appear; validation rejects a mismatch.
# `projection` is an explicit list, not a range: absent controls are
# unassigned and Beckon writes nothing for them.
[[layers]]
index = 3
name = "rex"
source = "rex"
projection = [
  { control = "key-1", slot = "s1" },
  { control = "key-2", slot = "s2" },
  { control = "key-3", slot = "s3" },
  { control = "key-4", slot = "s4" },
  { control = "key-5", slot = "s5" },
  { control = "key-6", slot = "s6" },
]

# Example of a different layer using a different set of channels. Requires
# that layer's keys to be given OAI keycodes in the keymap first.
# [[layers]]
# index = 4
# name = "herdr"
# source = "herdr"
# projection = [
#   { control = "key-1", slot = "s7" },
#   { control = "key-2", slot = "s8" },
# ]

# No device-level reservation. Other hosts are claimed PER LAYER and only when
# that layer is enabled and that host is running. Delete the declaration and
# the ids are free. No official integration is assumed to exist.
#
# [[layers]]
# index = 2
# name = "chatgpt"
# other_host = { name = "codex-micro", ids = [0, 1, 2, 3, 4, 5] }
#
# A custom ChatGPT layer would instead use its own id range plus a linkedApps
# entry for com.openai.codex, and declare its own source/projection. See
# docs/v1-design.md.

# Input presses resolve through the active layer: v.oai.hid gives a short code
# (e.g. "AG06"), which the adapter maps via (layer, control) -> the slot
# currently projected on that control. No input binding table is needed when
# address_source = "device".
