[package]
name = "beckon"
version = "0.2.4"
edition = "2024"
description = "Herdr pane navigation and pluggable status displays"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
global-hotkey = "0.8"
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.30"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
