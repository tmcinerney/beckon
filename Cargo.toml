[package]
name = "beckon"
version = "0.2.0"
edition = "2024"
description = "Glove80 state display and Herdr pane navigation"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
global-hotkey = "0.8"
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.30"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
